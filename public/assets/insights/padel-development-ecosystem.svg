<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1510" viewBox="0 0 1080 1510" role="img" aria-labelledby="title desc"><title id="title">The Complete Padel Development Ecosystem</title><desc id="desc">Qualified junior coaches underpin a pathway through discovery, junior development, junior performance, collegiate padel, international competition and lifelong padel culture.</desc><rect width="1080" height="1510" fill="#f4f2ec"/><rect width="1080" height="206" fill="#163c34"/><g text-anchor="middle" font-family="Arial,Helvetica,sans-serif"><text x="540" y="45" font-size="20" font-weight="bold" letter-spacing="3" fill="#d9c899">JULIAN WORTELBOER</text><text x="540" y="101" font-size="44" font-weight="bold" fill="#ffffff">THE COMPLETE PADEL</text><text x="540" y="151" font-size="44" font-weight="bold" fill="#ffffff">DEVELOPMENT ECOSYSTEM</text><text x="540" y="182" font-size="18" fill="#e7e9e3">From childhood discovery to lifelong participation</text><g><rect x="112" y="234" width="856" height="132" rx="15" fill="#163c34" stroke="#163c34" stroke-width="2"/><text x="540" y="263" font-size="18" font-weight="bold" letter-spacing="2" fill="#d9c899">FOUNDATION</text><text x="540" y="302" font-size="35" font-weight="bold" fill="#ffffff">Qualified Junior Coaches</text><text x="540" y="338" font-size="23" fill="#e7e9e3">Education · Certification · Methodology</text><path d="M540 366v22m-8-8 8 8 8-8" stroke="#638575" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g><rect x="112" y="396" width="856" height="132" rx="15" fill="#ffffff" stroke="#c9d4cd" stroke-width="2"/><text x="540" y="425" font-size="18" font-weight="bold" letter-spacing="2" fill="#526b60">AGES 4–7</text><text x="540" y="464" font-size="35" font-weight="bold" fill="#163c34">Discovery &amp; Fun</text><text x="540" y="500" font-size="23" fill="#40564d">Fundamental athletic development</text><path d="M540 528v22m-8-8 8 8 8-8" stroke="#638575" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g><rect x="112" y="558" width="856" height="132" rx="15" fill="#ffffff" stroke="#c9d4cd" stroke-width="2"/><text x="540" y="587" font-size="18" font-weight="bold" letter-spacing="2" fill="#526b60">AGES 8–12</text><text x="540" y="626" font-size="35" font-weight="bold" fill="#163c34">Junior Development</text><text x="540" y="662" font-size="23" fill="#40564d">Technical and tactical foundations</text><path d="M540 690v22m-8-8 8 8 8-8" stroke="#638575" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g><rect x="112" y="720" width="856" height="132" rx="15" fill="#ffffff" stroke="#c9d4cd" stroke-width="2"/><text x="540" y="749" font-size="18" font-weight="bold" letter-spacing="2" fill="#526b60">AGES 13–17</text><text x="540" y="788" font-size="35" font-weight="bold" fill="#163c34">Junior Performance</text><text x="540" y="824" font-size="23" fill="#40564d">Academies, schools and competition</text><path d="M540 852v22m-8-8 8 8 8-8" stroke="#638575" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g><rect x="112" y="882" width="856" height="132" rx="15" fill="#ffffff" stroke="#c9d4cd" stroke-width="2"/><text x="540" y="911" font-size="18" font-weight="bold" letter-spacing="2" fill="#526b60">UNIVERSITY YEARS</text><text x="540" y="950" font-size="35" font-weight="bold" fill="#163c34">Collegiate Padel</text><text x="540" y="986" font-size="23" fill="#40564d">University teams and national leagues</text><path d="M540 1014v22m-8-8 8 8 8-8" stroke="#638575" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g><rect x="112" y="1044" width="856" height="132" rx="15" fill="#ffffff" stroke="#c9d4cd" stroke-width="2"/><text x="540" y="1073" font-size="18" font-weight="bold" letter-spacing="2" fill="#526b60">INTERNATIONAL LEVEL</text><text x="540" y="1112" font-size="35" font-weight="bold" fill="#163c34">Global Competition</text><tex